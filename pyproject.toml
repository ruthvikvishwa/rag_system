[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system"
version = "1.0.0"  # Updated for memory integration
description = "Retrieval-Augmented Generation for PDF Documents with Automatic Memory Management"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["rag", "pdf", "vector-search", "embeddings", "ocr", "chunking", "memory", "chat"]

authors = [
    {name = "RAG System Team", email = "team@rag-system.com"}
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.4",
    "pdf2image>=1.16.3",
    "PyTesseract>=0.3.10",
    "python-tesseract>=0.2.0",
    "chromadb>=0.4.22",
    "Pillow>=10.0.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "sentence-transformers>=2.2.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "mypy>=1.0.0",
]
pgvector = ["psycopg2-binary>=2.9.0"]
weaviate = ["weaviate-client>=3.21.0"]
memory = [
    "flask>=3.0.0",  # For web interface
    "flask-cors>=4.0.0",  # For cross-origin requests
]

[project.scripts]
rag-system = "rag_system.main:main"
rag-memory = "rag_system.memory.memory_manager:main"

[project.urls]
Homepage = "https://github.com/ruthvikvishwa/rag_system"
Documentation = "https://github.com/ruthvikvishwa/rag_system#readme"
Repository = "https://github.com/ruthvikvishwa/rag_system"
Issues = "https://github.com/ruthvikvishwa/rag_system/issues"

[tool.setuptools]
packages = [
    "rag_system",
    "rag_system.core",
    "rag_system.chunking",
    "rag_system.vector_store",
    "rag_system.document_processor",
    "rag_system.memory",
    "rag_system.query_handler",
    "rag_system.utils"
]

[tool.setuptools.package-data]
"*" = ["*.py", "*.txt", "*.md", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.8"
disallow_untyped_defs = false  # Disabled due to dynamic code
disallow_any_untyped = false
check_untyped_defs = true

[tool.ruff]
line-length = 88
indent-width = 4