[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system"
version = "0.1.0"
description = "Retrieval-Augmented Generation for PDF Documents"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["rag", "pdf", "vector-search", "embeddings", "ocr", "chunking"]

authors = [
    {name = "RAG System Team"}
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "PyMuPDF>=1.21.0",
    "pdfplumber>=0.9.0",
    "pdf2image>=1.16.0",
    "PyTesseract>=0.3.10",
    "chromadb>=0.3.20",
    "Pillow>=9.0.0",
    "sentence-transformers>=2.0.0",
    "numpy>=1.21.0",
    "tqdm>=4.65.0",
]

[project.scripts]
rag-system = "rag_system.main:main"

[project.urls]
Homepage = "https://github.com/your-org/rag-system"

[tool.setuptools]
packages = ["rag_system", "rag_system.core", "rag_system.chunking", "rag_system.document_processor", "rag_system.vector_store"]
package-dir = {rag_system = ".", core = "core", chunking = "chunking", document_processor = "document_processor", vector_store = "vector_store"}

[tool.setuptools.package-data]
"*" = ["*.py", "*.txt", "*.md"]